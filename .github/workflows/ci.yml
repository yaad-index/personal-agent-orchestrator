name: CI

# Runs on the pull request and on the push that lands it (a squash onto a base
# that has moved is a combination the pull request's run never covered).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # The latest patch of the Go minor version go.mod requires. go.mod names an
          # exact minimum (go 1.26.0), which go-version-file would install as that
          # exact release and never move off.
          go-version: "1.26"

      # The wire between nodes is generated from proto/ and the result is committed.
      # These steps regenerate it with the tool versions scripts/genproto.sh pins and
      # fail if the committed files are not what the generator produces.
      - name: Install protoc
        env:
          PROTOC_VERSION: "36.2"
          PROTOC_SHA256: 121f6c7afe1d4d0e3ea6aab9432038599250134cbf4474cb1167d2c7decd4278
        run: |
          curl -sSfL -o "$RUNNER_TEMP/protoc.zip" \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          echo "${PROTOC_SHA256}  $RUNNER_TEMP/protoc.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/protoc.zip" -d "$RUNNER_TEMP/protoc"
          echo "$RUNNER_TEMP/protoc/bin" >> "$GITHUB_PATH"

      - name: Install protoc plugins
        run: |
          GOBIN="$RUNNER_TEMP/protoc/bin" go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          GOBIN="$RUNNER_TEMP/protoc/bin" go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2

      - name: Generated code is current
        run: |
          go generate ./internal/mesh/meshpb
          if [ -n "$(git status --porcelain -- internal/mesh/meshpb)" ]; then
            echo "The generated code under internal/mesh/meshpb is not what the generator produces:"
            git status --porcelain -- internal/mesh/meshpb
            git diff -- internal/mesh/meshpb | head -50
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4

      - name: Test
        run: go test -race ./...
